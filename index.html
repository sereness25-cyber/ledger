<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【帳簿】セレネス売上・仕入管理</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; color: #333; }

        .app-container { background: #fff; max-width: 900px; margin: 0 auto; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative;}
        .app-head { display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 2px solid #A68B5B; padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        h1 { font-size: 1.3em; margin: 0; text-align: center; color: #333;}

        /* 同期の状態 */
        #sync-status { font-size: 0.75em; font-weight: bold; padding: 4px 10px; border-radius: 999px; background: #eef6ee; color: #3c763d; border: 1px solid #cfe5cf; white-space: nowrap; }
        #sync-status.pending { background: #fff4e5; color: #a15c00; border-color: #f5c98a; cursor: pointer; }
        #sync-status.sending { background: #eef4fb; color: #5b7da6; border-color: #c9d8ea; }

        .tab-wrapper { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px 2px; border: 1px solid #ccc; background: #f9f9f9; color: #666; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 0.85em; text-align: center; transition: 0.2s; min-width: 70px;}
        .tab-btn.active-sales { background: #5b7da6; color: white; border-color: #5b7da6; }
        .tab-btn.active-purchase { background: #d9534f; color: white; border-color: #d9534f; }
        .tab-btn.active-report { background: #A68B5B; color: white; border-color: #A68B5B; }
        .tab-btn.active-calendar { background: #7c5ba6; color: white; border-color: #7c5ba6; }

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.85em; color: #555;}
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; min-width: 0; }

        .input-group { position: relative; }
        .input-group input { padding-right: 30px; text-align: right; font-weight: bold;}
        .input-group::after { content: "円"; position: absolute; right: 10px; top: 18px; color: #666; font-size: 0.9em;}

        /* 今日の入力状況 */
        .today-status { padding: 10px 12px; border-radius: 6px; font-size: 0.9em; background: #f6f6f6; color: #666; border: 1px solid #eee; }
        .today-status b { color: #333; }
        .today-status.done { background: #eef4fb; border-color: #c9d8ea; color: #44617f; }

        /* 男性・女性の人数入力 */
        .people { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 6px 12px; margin-top: 6px; }
        .person-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; flex-wrap: wrap; }
        .person-row + .person-row { border-top: 1px dashed #ddd; }
        .person-label { font-weight: bold; font-size: 1.05em; width: 2.6em; }
        .person-label.male { color: #5b7da6; } .person-label.female { color: #c2577a; } .person-label.amount { color: #333; }
        .stepper { display: flex; align-items: center; gap: 6px; }
        .stepper button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-size: 1.4em; font-weight: bold; color: #555; cursor: pointer; line-height: 1; }
        .stepper button:active { background: #eee; }
        .stepper input { width: 64px; margin: 0; text-align: center; font-size: 1.3em; font-weight: bold; padding: 8px 4px; }
        .unit { font-size: 0.85em; color: #666; display: flex; align-items: center; gap: 4px; margin-left: auto; white-space: nowrap; }
        .unit input { width: 84px; margin: 0; padding: 8px; text-align: right; font-size: 15px; }
        .sub-total { font-size: 0.8em; color: #888; width: 100%; text-align: right; margin-top: -4px; }

        .item-list { background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; margin-top: 5px; }
        .item-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
        .item-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .item-inputs { display: flex; gap: 5px; align-items: center; }
        .item-inputs input { margin-top: 0; padding: 10px; text-align: right;}
        .unit-text { font-size: 0.85em; color: #666; white-space: nowrap; }
        .btn-remove-item { background: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; min-width: 44px; }

        .btn-add-item { background: #e0e0e0; color: #333; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; width: 100%; margin-top: 10px; font-weight: bold;}
        .btn-add-item:hover { background: #ccc; }

        .extra-costs { display: flex; gap: 10px; margin-top: 10px; }
        .extra-costs > div { flex: 1; }

        .total-amount-display { font-size: 1.6em; font-weight: bold; text-align: right; padding: 15px 0 5px; color: #333; }

        .btn-submit { color: white; border: none; padding: 16px; margin-top: 20px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s;}
        .btn-sales { background-color: #5b7da6; }
        .btn-purchase { background-color: #d9534f; }
        .btn-submit:hover { opacity: 0.8; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .btn-cancel-edit { display: none; background: #999; color: #fff; border: none; padding: 12px; margin-top: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* レポート画面のスタイル */
        .summary-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .summary-month { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #A68B5B; display: flex; justify-content: space-between; align-items: center;}
        .summary-month button { background: none; border: 1px solid #ccc; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9em;}

        .target-btn { background: none; border: 1px dashed #A68B5B; color: #A68B5B; width: 100%; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; font-weight: bold; margin-bottom: 15px; transition: 0.2s;}
        .target-btn:hover { background: #fcfaf7; }

        .progress-wrapper { background: #e0e0e0; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background: #5b7da6; border-radius: 3px; transition: width 0.5s; }
        .progress-bar.achieved { background: #A68B5B; }
        .target-text { font-size: 0.75em; color: #666; margin-top: 5px; display: block; }
        .compare { font-size: 0.75em; color: #888; margin-top: 4px; display: block; }
        .compare .up { color: #3c763d; font-weight: bold; }
        .compare .down { color: #a94442; font-weight: bold; }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .summary-item { padding: 15px; border-radius: 6px; }
        .item-sales { background: #eef4fb; border-left: 4px solid #5b7da6; }
        .item-purchase { background: #fdf2f2; border-left: 4px solid #d9534f; }
        .summary-label { font-size: 0.8em; color: #666; display: block; margin-bottom: 5px;}
        .summary-value { font-size: 1.4em; font-weight: bold; }
        .val-sales { color: #5b7da6; }
        .val-purchase { color: #d9534f; }

        .profit-box { background: #f5f5f0; padding: 20px 15px; border-radius: 6px; border-left: 4px solid #A68B5B; box-shadow: inset 0 0 10px rgba(0,0,0,0.02);}
        .profit-value { font-size: 1.8em; font-weight: bold; color: #333; display: block; margin-top: 5px; }

        .profit-details { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
        .profit-details div { text-align: center; flex: 1; padding: 0 5px; }
        .profit-details div:not(:last-child) { border-right: 1px dashed #ccc; }
        .detail-label { display: block; font-size: 0.75em; color: #666; margin-bottom: 3px; }
        .detail-value { font-size: 1.1em; font-weight: bold; color: #333; }
        .detail-sub { display: block; font-size: 0.7em; color: #888; margin-top: 2px; }

        /* 区分別の内訳 */
        .breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; text-align: left; }
        .breakdown h5 { margin: 0 0 8px; font-size: 0.85em; }
        .bd-row { font-size: 0.8em; margin-bottom: 8px; }
        .bd-top { display: flex; justify-content: space-between; gap: 6px; }
        .bd-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bd-top span:last-child { font-weight: bold; white-space: nowrap; }
        .bd-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 3px; overflow: hidden; }
        .bd-bar i { display: block; height: 100%; border-radius: 3px; }
        .bd-empty { font-size: 0.8em; color: #aaa; }

        /* ▼ カレンダー表示のスタイル ▼ */
        .cal-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; background: #fff;}
        .cal-table th { background: #f8f8f8; padding: 10px 0; border: 1px solid #ddd; font-size: 0.8em; color: #666; font-weight: normal;}
        .cal-table td { height: 80px; border: 1px solid #ddd; vertical-align: top; padding: 4px; position: relative; cursor: pointer; overflow: hidden;}
        .cal-table td:hover { filter: brightness(0.97); }
        .cal-day-num { font-size: 0.85em; font-weight: bold; color: #888; margin-bottom: 2px; display: block;}
        .cal-target-amt, .cal-actual-amt, .cal-pct { font-size: 0.65em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.5px; line-height: 1.3;}
        .cal-target-amt { color: #5b7da6; font-weight: bold; }
        .cal-actual-amt { color: #333; margin-top: 2px;}
        .cal-pct { color: #A68B5B; font-weight: bold;}
        .cal-today .cal-day-num { color: #fff; background: #A68B5B; border-radius: 999px; display: inline-block; padding: 0 6px; }
        .cal-sunday { color: #d9534f; }
        .cal-saturday { color: #5b7da6; }
        .cal-hit { background: #eaf6ea; }
        .cal-miss { background: #fdf1e6; }
        .cal-has { background: #eef4fb; }
        .cal-selected { box-shadow: inset 0 0 0 2px #7c5ba6; }
        .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.72em; color: #777; margin-top: 8px; }
        .cal-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid #ddd; }
        .lg-hit::before { background: #eaf6ea; } .lg-miss::before { background: #fdf1e6; } .lg-has::before { background: #eef4fb; }

        /* 日付の詳細 */
        .day-detail { margin-top: 15px; border: 1px solid #e3dcef; border-radius: 8px; padding: 15px; background: #fbf9fe; }
        .day-detail h4 { margin: 0 0 10px; color: #7c5ba6; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .day-detail h4 small { font-size: 0.75em; color: #666; font-weight: normal; }
        .day-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .day-actions button { flex: 1; min-width: 130px; border: none; color: #fff; border-radius: 4px; padding: 10px; font-weight: bold; cursor: pointer; }
        .day-target { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
        .day-target .input-group { flex: 1; }
        .day-target input { margin-top: 0; padding: 10px; }
        .day-target button { border: none; background: #7c5ba6; color: #fff; border-radius: 4px; padding: 11px 16px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        .history-controls { display: flex; gap: 10px; margin-bottom: 15px; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .history-controls input { flex: 2; margin-top: 0; padding: 10px; }
        .history-controls select { flex: 1; margin-top: 0; padding: 10px; }

        .history-split { display: flex; gap: 20px; align-items: flex-start; }
        .history-col { flex: 1; min-width: 0; background: #fff; }
        .history-col h4 { margin: 0 0 10px; font-size: 1.1em; border-bottom: 2px solid; padding-bottom: 8px; display: flex; justify-content: space-between; }
        .history-col h4 small { font-size: 0.7em; font-weight: normal; color: #888; }
        .col-sales h4 { color: #5b7da6; border-color: #5b7da6; }
        .col-purchase h4 { color: #d9534f; border-color: #d9534f; }

        /* 履歴（カード） */
        .day-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.8em; color: #666; margin: 14px 2px 6px; font-weight: bold; }
        .day-head:first-child { margin-top: 0; }
        .rec { border: 1px solid #e6e6e6; border-left-width: 4px; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
        .rec.sales { border-left-color: #5b7da6; }
        .rec.purchase { border-left-color: #d9534f; }
        .rec-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .rec-cat { font-weight: bold; font-size: 0.9em; }
        .rec-amt { font-weight: bold; font-size: 1.05em; white-space: nowrap; }
        .rec-items { font-size: 0.8em; color: #555; margin-top: 4px; line-height: 1.5; word-break: break-word; }
        .rec-note { font-size: 0.78em; color: #888; margin-top: 3px; }
        .rec-btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
        .rec-btns button { border: 1px solid #ddd; background: #fff; border-radius: 4px; padding: 5px 12px; font-size: 0.8em; cursor: pointer; color: #555; }
        .rec-btns .b-edit { border-color: #5cb85c; color: #3c763d; }
        .rec-btns .b-del { color: #a94442; border-color: #e3b9b8; }
        .rec-pending { font-size: 0.7em; color: #a15c00; background: #fff4e5; border-radius: 3px; padding: 1px 5px; margin-left: 4px; font-weight: normal; }
        .btn-more { width: 100%; border: 1px dashed #ccc; background: #fafafa; color: #555; border-radius: 6px; padding: 10px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .empty { text-align: center; color: #999; font-size: 0.8em; padding: 10px; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 30px; font-size: 0.95em; display: none; z-index: 1000; white-space: nowrap;}
        #edit-banner { background: #f0ad4e; color: white; text-align: center; padding: 12px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; display: none;}
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 2000; display: flex; justify-content: flex-start; padding-top: 120px; box-sizing: border-box; align-items: center; border-radius: 8px; font-weight: bold; color: #A68B5B; font-size: 1.2em; flex-direction: column; text-align: center;}
        #loading-overlay button { margin-top: 15px; border: none; background: #A68B5B; color: #fff; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-size: 0.8em; cursor: pointer; }
        #loading-overlay .sub { font-size: 0.65em; color: #666; margin-top: 10px; font-weight: normal; line-height: 1.6; }

        .layout { display: block; }

        /* パソコン・タブレット：左に入力、右にレポート／カレンダー */
        @media (min-width: 960px) {
            .app-container { max-width: 1280px; }
            .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: start; }
            .pane-input { position: sticky; top: 15px; max-height: calc(100vh - 30px); overflow-y: auto; padding-right: 4px; }
            .tab-wrapper { max-width: 760px; margin-left: auto; margin-right: auto; }
        }

        @media (max-width: 700px) {
            body { padding: 0; background-color: #fff; }
            .app-container { max-width: 100%; box-shadow: none; border-radius: 0; padding: 15px 10px; }
            h1 { font-size: 1.1em; }
            .tab-btn { font-size: 0.8em; padding: 10px 2px; }
            .history-split { flex-direction: column; gap: 20px; align-items: stretch; }
            .breakdown { grid-template-columns: 1fr; }
            .cal-table td { height: 70px; }
            .cal-day-num { font-size: 0.75em; }
            .cal-target-amt, .cal-actual-amt, .cal-pct { font-size: 0.55em; letter-spacing: -0.5px;}
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loading-overlay">データを同期中...<span class="sub">(少々お待ちください)</span></div>

    <div class="app-head">
        <h1>セレネス 帳簿・収益管理</h1>
        <span id="sync-status" onclick="flushQueue(true)">✓ 保存済み</span>
    </div>

    <div class="tab-wrapper">
        <button class="tab-btn active-sales" id="tab-sales" onclick="switchTab('sales')">売上入力</button>
        <button class="tab-btn" id="tab-purchase" onclick="switchTab('purchase')">仕入入力</button>
        <button class="tab-btn" id="tab-report" onclick="switchTab('report')">レポート</button>
        <button class="tab-btn" id="tab-calendar" onclick="switchTab('calendar')">目標カレンダー</button>
    </div>

    <div class="layout">
    <div class="pane pane-input">
        <div id="edit-banner">現在、過去の記録を編集中です...</div>
        <input type="hidden" id="edit-id">

        <div id="section-sales">
            <div class="today-status" id="today-status"></div>
            <div class="row-2">
                <div><label>日付</label><input type="date" id="sales-date" onchange="renderTodayStatus()"></div>
                <div><label>売上区分</label>
                    <select id="sales-category">
                        <option value="店舗">店舗</option>
                        <option value="イベント">イベント</option>
                        <option value="Uber">Uber</option>
                    </select>
                </div>
            </div>
            <label>来店人数と売上</label>
            <div class="people">
                <div class="person-row">
                    <span class="person-label male">男性</span>
                    <div class="stepper"><button type="button" onclick="stepPeople('male',-1)" aria-label="男性を1人減らす">−</button><input type="text" pattern="[0-9]*" inputmode="numeric" min="0" id="sales-male" value="0" oninput="calcTotal('sales')"><button type="button" onclick="stepPeople('male',1)" aria-label="男性を1人増やす">＋</button><span style="font-weight:bold">名</span></div>
                </div>
                <div class="person-row">
                    <span class="person-label female">女性</span>
                    <div class="stepper"><button type="button" onclick="stepPeople('female',-1)" aria-label="女性を1人減らす">−</button><input type="text" pattern="[0-9]*" inputmode="numeric" min="0" id="sales-female" value="0" oninput="calcTotal('sales')"><button type="button" onclick="stepPeople('female',1)" aria-label="女性を1人増やす">＋</button><span style="font-weight:bold">名</span></div>
                </div>
                <div class="person-row">
                    <span class="person-label amount">合計</span>
                    <div class="input-group" style="flex:1"><input type="text" pattern="[0-9]*" inputmode="numeric" id="sales-amount" placeholder="売上金額" oninput="calcTotal('sales')" style="font-size:1.3em; margin-top:0"></div>
                </div>
            </div>
            <span id="sales-total" hidden></span>
            <label>メモ（任意）</label>
            <input type="text" id="sales-note" placeholder="例：〇〇様ご来店 など">
            <button class="btn-submit btn-sales" id="btn-sales-submit" onclick="saveData('sales')">売上を記録する</button>
            <button class="btn-cancel-edit" id="btn-sales-cancel" onclick="cancelEdit()">編集をやめる</button>
        </div>

        <div id="section-purchase" style="display: none;">
            <div class="row-2">
                <div><label style="margin-top:0">日付</label><input type="date" id="purchase-date"></div>
                <div><label style="margin-top:0">経費区分</label>
                    <select id="purchase-category">
                        <option value="酒類・飲料">酒類・飲料</option>
                        <option value="食材・おつまみ">食材・おつまみ</option>
                        <option value="消耗品（紙袋・洗剤など）">消耗品（紙袋・洗剤など）</option>
                        <option value="備品・設備">備品・設備</option>
                        <option value="広告宣伝費">広告宣伝費</option>
                        <option value="家賃・光熱費など">家賃・光熱費など固定費</option>
                        <option value="その他経費">その他経費</option>
                    </select>
                </div>
            </div>
            <label>内訳（何を何個）</label>
            <div class="item-list" id="purchase-items"></div>
            <button type="button" class="btn-add-item" onclick="addItemRow('purchase')">＋ さらに明細を追加する</button>
            <div class="extra-costs">
                <div><label style="margin-top: 0;">送料・手数料 (+)</label><div class="input-group"><input type="text" pattern="[0-9]*" id="purchase-shipping" placeholder="0" inputmode="numeric" oninput="calcTotal('purchase')"></div></div>
                <div><label style="margin-top: 0;">割引・ポイント (-)</label><div class="input-group"><input type="text" pattern="[0-9]*" id="purchase-discount" placeholder="0" inputmode="numeric" oninput="calcTotal('purchase')"></div></div>
            </div>
            <div class="total-amount-display">合計: <span id="purchase-total" class="val-purchase">¥0</span></div>
            <label>購入先・メモ</label>
            <input type="text" id="purchase-note" placeholder="例：Amazon など">
            <button class="btn-submit btn-purchase" id="btn-purchase-submit" onclick="saveData('purchase')">仕入・経費を記録する</button>
            <button class="btn-cancel-edit" id="btn-purchase-cancel" onclick="cancelEdit()">編集をやめる</button>
        </div>
    </div>

    <div class="pane pane-view">
        <div id="section-report" style="display: none;">
            <div class="summary-box">
                <div class="summary-month"><button onclick="changeMonth(-1)">＜ 先月</button><span id="display-month">2026年 3月</span><button onclick="changeMonth(1)">来月 ＞</button></div>
                <button class="target-btn" onclick="toggleTargetModal()">🎯 売上目標を設定する</button>
                <div id="target-settings" style="display: none; background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; text-align: left; position: relative;">
                    <button onclick="toggleTargetModal()" style="position: absolute; right: 10px; top: 10px; background: none; border: none; font-size: 1.5em; color: #999; cursor: pointer;">×</button>
                    <h4 style="margin: 0 0 10px; font-size: 1em; color: #A68B5B;">🎯 月間トータル目標</h4>
                    <div class="input-group"><input type="text" pattern="[0-9]*" id="input-target-monthly" inputmode="numeric"></div>
                    <button class="btn-submit" style="margin-top:10px; padding:10px; background:#A68B5B; font-size: 0.9em;" onclick="saveMonthlyTarget()">保存</button>
                    <p style="font-size:0.75em; color:#888; margin:12px 0 0;">📅 1日ごとの目標は「目標カレンダー」で日付をタップして設定できます。</p>
                </div>
                <div class="summary-grid">
                    <div class="summary-item item-sales"><span class="summary-label">売上合計</span><span class="summary-value val-sales" id="total-sales">¥0</span><span class="compare" id="sales-compare"></span><div id="monthly-target-display"></div></div>
                    <div class="summary-item item-purchase"><span class="summary-label">仕入合計</span><span class="summary-value val-purchase" id="total-purchase">¥0</span><span class="compare" id="purchase-compare"></span></div>
                </div>
                <div class="profit-box">
                    <span class="summary-label">今月の粗利益</span><span class="profit-value" id="total-profit">¥0</span>
                    <span class="compare" id="profit-compare"></span>
                    <div class="profit-details">
                        <div><span class="detail-label">利益率</span><span class="detail-value" id="profit-margin">0%</span></div>
                        <div><span class="detail-label">1日平均</span><span class="detail-value" id="avg-sales">¥0</span><span class="detail-sub" id="active-days"></span></div>
                        <div><span class="detail-label">目標達成</span><span class="detail-value" id="achieved-days">-</span><span class="detail-sub" id="achieved-sub"></span></div>
                    </div>
                </div>
                <div class="breakdown">
                    <div><h5 class="val-sales">売上の内訳</h5><div id="breakdown-sales"></div></div>
                    <div><h5 class="val-purchase">仕入・経費の内訳</h5><div id="breakdown-purchase"></div></div>
                </div>
            </div>
            <div class="history-controls"><input type="text" id="search-keyword" placeholder="品名・メモで検索..." oninput="resetHistoryLimit(); renderReport()"><select id="sort-order" onchange="resetHistoryLimit(); renderReport()"><option value="date-desc">新しい順</option><option value="date-asc">古い順</option></select></div>
            <div class="history-split">
                <div class="history-col col-sales"><h4>売上履歴 <small id="count-sales"></small></h4><div class="history-list" id="history-sales-container"></div></div>
                <div class="history-col col-purchase"><h4>仕入履歴 <small id="count-purchase"></small></h4><div class="history-list" id="history-purchase-container"></div></div>
            </div>
        </div>

        <div id="section-calendar" style="display: none;">
            <div class="summary-box" style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; padding: 15px;">
                <div class="summary-month" style="margin-bottom: 0; justify-content: center; gap: 15px;">
                    <button onclick="changeMonth(-1)">＜</button>
                    <span id="cal-display-month">2026年 3月</span>
                    <button onclick="changeMonth(1)">＞</button>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #eee; padding-top: 10px; font-size: 0.9em;">
                    <div><span style="color:#666;">今月の目標:</span> <span id="cal-sum-target" style="font-weight:bold; color:#A68B5B;">¥0</span></div>
                    <div><span style="color:#666;">今月の売上:</span> <span id="cal-sum-sales" style="font-weight:bold; font-size: 1.2em; color:#333;">¥0</span></div>
                </div>
            </div>
            <table class="cal-table">
                <thead>
                    <tr><th class="cal-sunday">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="cal-saturday">土</th></tr>
                </thead>
                <tbody id="calendar-body"></tbody>
            </table>
            <div class="cal-legend" id="cal-legend"></div>
            <div class="day-detail" id="day-detail"></div>
        </div>
    </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbysuqUZwOrTU_-GHNpAb-3rEr4tU9fHfn0aIPuBnzT-uvHnql8yyVFqT4pCQvu8gfNu/exec";
    let allLedgerData = [];
    const today = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const todayStr = ymd(today);
    const yen = (n) => '¥' + (Number(n) || 0).toLocaleString();
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const isTargetType = (t) => String(t || '').startsWith('target');
    const WEEK = ['日', '月', '火', '水', '木', '金', '土'];

    let reportYear = today.getFullYear();
    let reportMonth = today.getMonth() + 1;
    let activeTab = 'sales', inputTab = 'sales', viewTab = 'report';
    let selectedDay = todayStr;
    const HISTORY_STEP = 10;
    let historyLimit = { sales: HISTORY_STEP, purchase: HISTORY_STEP };

    // 数字の欄：全角数字を半角に、数字以外は消す（計算より先に動くよう capture で登録）
    document.addEventListener('input', (e) => {
        const el = e.target;
        if (el.tagName !== 'INPUT' || el.getAttribute('inputmode') !== 'numeric') return;
        const v = el.value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
        if (v !== el.value) el.value = v;
    }, true);

    window.onload = () => {
        resetForm('sales'); resetForm('purchase');
        loadLedgerData();
        applyLayout();
        window.addEventListener('resize', applyLayout);
        window.addEventListener('online', () => flushQueue());
        setInterval(() => { if (loadQueue().length) flushQueue(); }, 30000);
        updateSyncStatus();
    };

    /* ===== 送信待ちの記録（電波が悪くても消えないように端末に控える） ===== */
    const QKEY = 'ledger_pending_v1';
    function loadQueue() { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } }
    function saveQueue(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
    function enqueue(payload) { const q = loadQueue(); q.push(payload); saveQueue(q); updateSyncStatus(); flushQueue(); }
    function pendingIds() { return new Set(loadQueue().filter(p => p.type === 'ledger_save').map(p => p.record.id)); }

    // Apps Script に届いたら成功（届かなかったら端末に残して、あとで送り直す）
    async function postGas(payload) {
        try {
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
            return true;
        } catch (e) { return false; }
    }
    let flushing = false;
    async function flushQueue(manual) {
        if (flushing) return;
        let q = loadQueue();
        if (!q.length) { if (manual) showToast('すべて保存済みです'); return; }
        flushing = true; updateSyncStatus();
        while (q.length) {
            const ok = await postGas(q[0]);
            if (!ok) break;
            q.shift(); saveQueue(q);
        }
        flushing = false; updateSyncStatus();
        if (q.length) { if (manual) showToast('まだ送れませんでした。電波の良い所でもう一度'); }
        else { showToast('保存が完了しました'); renderReport(); renderCalendar(); }
    }
    function updateSyncStatus() {
        const el = document.getElementById('sync-status');
        const n = loadQueue().length;
        if (flushing) { el.className = 'sending'; el.textContent = '↻ 送信中...'; }
        else if (n) { el.className = 'pending'; el.textContent = `⚠️ 未送信 ${n}件（タップで再送）`; }
        else { el.className = ''; el.textContent = '✓ 保存済み'; }
    }
    // 読み込んだデータに、まだ送れていない変更を重ねる
    function applyPending(list) {
        loadQueue().forEach(p => {
            if (p.type === 'ledger_save') { const i = list.findIndex(r => r.id === p.record.id); if (i >= 0) list[i] = p.record; else list.push(p.record); }
            if (p.type === 'ledger_delete') { list = list.filter(r => r.id !== p.id); }
        });
        return list;
    }

    function loadLedgerData() {
        const ov = document.getElementById('loading-overlay');
        ov.innerHTML = 'データを同期中...<span class="sub">(少々お待ちください)</span>';
        ov.style.display = 'flex';
        fetch(GAS_URL).then(res => res.json()).then(data => {
            allLedgerData = applyPending((data.ledger || []).map(r => {
                if (r.date && String(r.date).includes('T')) r.date = ymd(new Date(r.date));
                r.amount = Number(r.amount) || 0;
                return r;
            }));
            renderAll();
            ov.style.display = 'none';
            if (loadQueue().length) flushQueue();
        }).catch(err => {
            ov.innerHTML = '⚠️ データを読み込めませんでした<span class="sub">電波の状態を確認して、もう一度お試しください。<br>入力した記録は、この端末に控えてから送ります。</span><button onclick="loadLedgerData()">もう一度読み込む</button><button style="background:#999" onclick="document.getElementById(\'loading-overlay\').style.display=\'none\'; allLedgerData = applyPending([]); renderAll();">このまま入力する</button>';
        });
    }

    function renderAll() { renderReport(); renderCalendar(); renderTodayStatus(); }

    /* ===== タブと画面の並び ===== */
    const isWide = () => window.matchMedia('(min-width: 960px)').matches;
    function switchTab(tab) {
        activeTab = tab;
        if (tab === 'sales' || tab === 'purchase') inputTab = tab; else viewTab = tab;
        applyLayout();
        if (!isWide()) window.scrollTo({ top: 0 });
    }
    function applyLayout() {
        const wide = isWide();
        const shown = (t) => wide ? (t === inputTab || t === viewTab) : t === activeTab;
        ['sales', 'purchase', 'report', 'calendar'].forEach(t => {
            document.getElementById(`section-${t}`).style.display = shown(t) ? 'block' : 'none';
            document.getElementById(`tab-${t}`).className = 'tab-btn' + (shown(t) ? ` active-${t}` : '');
        });
        if (shown('report')) renderReport();
        if (shown('calendar')) renderCalendar();
    }

    /* ===== 入力フォーム ===== */
    function addItemRow(type, name = '', price = '', qty = 1) {
        const container = document.getElementById(`${type}-items`);
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `<input type="text" class="i-name" placeholder="品名" value="${esc(name)}" oninput="calcTotal('${type}')"><div class="item-inputs"><input type="text" pattern="[0-9]*" inputmode="numeric" class="i-price" placeholder="単価" value="${esc(price)}" oninput="calcTotal('${type}')" style="flex:3;"><span class="unit-text">円×</span><input type="text" pattern="[0-9]*" inputmode="numeric" class="i-qty" value="${esc(qty)}" oninput="calcTotal('${type}')" style="flex:2;"><span class="unit-text">個</span><button type="button" class="btn-remove-item" onclick="removeRow(this,'${type}')">✖</button></div>`;
        container.appendChild(row);
        return row;
    }
    function removeRow(btn, type) {
        btn.closest('.item-row').remove();
        if (!document.querySelector(`#${type}-items .item-row`)) addItemRow(type);
        calcTotal(type);
    }
    function stepPeople(who, d) {
        const el = document.getElementById(`sales-${who}`);
        el.value = Math.max(0, (parseInt(el.value) || 0) + d);
    }
    const num = (id) => Math.max(0, parseInt(document.getElementById(id).value) || 0);
    function calcTotal(type) {
        if (type === 'sales') {
            const t = num('sales-amount');
            document.getElementById('sales-total').textContent = yen(t);
            return t;
        }
        const rows = document.querySelectorAll(`#${type}-items .item-row`);
        let total = 0;
        rows.forEach(r => total += (parseInt(r.querySelector('.i-price').value) || 0) * (parseInt(r.querySelector('.i-qty').value) || 0));
        if (type === 'purchase') total += (parseInt(document.getElementById('purchase-shipping').value) || 0) - (parseInt(document.getElementById('purchase-discount').value) || 0);
        document.getElementById(`${type}-total`).textContent = yen(Math.max(0, total));
        return total;
    }
    function resetForm(type) {
        if (type === 'sales') {
            document.getElementById('sales-male').value = 0; document.getElementById('sales-female').value = 0;
            document.getElementById('sales-amount').value = '';
        } else {
            document.getElementById('purchase-items').innerHTML = '';
            addItemRow('purchase');
        }
        document.getElementById(`${type}-note`).value = '';
        if (type === 'purchase') { document.getElementById('purchase-shipping').value = ''; document.getElementById('purchase-discount').value = ''; }
        if (!document.getElementById(`${type}-date`).value) document.getElementById(`${type}-date`).value = todayStr;
        document.getElementById(`btn-${type}-submit`).textContent = type === 'sales' ? '売上を記録する' : '仕入・経費を記録する';
        document.getElementById(`btn-${type}-cancel`).style.display = 'none';
        calcTotal(type);
    }

    /* ===== 今日の入力状況 ===== */
    function renderTodayStatus() {
        const d = document.getElementById('sales-date').value || todayStr;
        const recs = allLedgerData.filter(r => r.type === 'sales' && r.date === d);
        const label = d === todayStr ? '今日' : d.slice(5).replace('-', '/');
        const el = document.getElementById('today-status');
        if (recs.length) {
            const total = recs.reduce((s, r) => s + r.amount, 0);
            el.className = 'today-status done';
            el.innerHTML = `✅ ${label}の売上：<b>${yen(total)}</b>（${recs.length}件 記録済み）`;
        } else {
            el.className = 'today-status';
            el.innerHTML = `📝 ${label}の売上はまだ記録されていません`;
        }
    }

    /* ===== 保存・削除 ===== */
    let saving = false;
    function saveData(type) {
        if (saving) return;
        const date = document.getElementById(`${type}-date`).value;
        const cat = document.getElementById(`${type}-category`).value;
        const note = document.getElementById(`${type}-note`).value;
        const editId = document.getElementById('edit-id').value;
        const items = [];
        if (type === 'sales') {
            // 金額は合計だけ。人数は記録として残す（単価は 0）
            const male = num('sales-male'), female = num('sales-female');
            if (male) items.push({ name: '男性', price: 0, qty: male });
            if (female) items.push({ name: '女性', price: 0, qty: female });
        } else document.querySelectorAll(`#${type}-items .item-row`).forEach(r => {
            const n = r.querySelector('.i-name').value.trim();
            const p = parseInt(r.querySelector('.i-price').value) || 0;
            const q = parseInt(r.querySelector('.i-qty').value) || 0;
            if (n || p) items.push({ name: n || '名称なし', price: p, qty: q });
        });
        const total = calcTotal(type);
        if (!date || total <= 0) return alert(type === 'sales' ? "売上金額を入力してください" : "金額か明細を入力してください");

        saving = true; setTimeout(() => saving = false, 800);   // 二度押し防止
        const record = { id: editId ? parseInt(editId) : Date.now(), type, date, category: cat, amount: Math.max(0, total), note, items, shipping: type === 'purchase' ? parseInt(document.getElementById('purchase-shipping').value) || 0 : 0, discount: type === 'purchase' ? parseInt(document.getElementById('purchase-discount').value) || 0 : 0 };
        if (editId) { const idx = allLedgerData.findIndex(r => r.id === record.id); if (idx !== -1) allLedgerData[idx] = record; else allLedgerData.push(record); } else { allLedgerData.push(record); }
        exitEditMode();
        resetForm(type);
        renderAll();
        showToast(editId ? '上書き保存しました' : '保存しました');
        enqueue({ type: 'ledger_save', record });
    }

    function deleteRecord(id) {
        const r = allLedgerData.find(x => x.id === id);
        if (!r || !confirm(`${r.date.replace(/-/g, '/')} の ${r.category}（${yen(r.amount)}）を削除しますか？`)) return;
        allLedgerData = allLedgerData.filter(x => x.id !== id);
        // まだ送れていない保存があれば取り消す
        saveQueue(loadQueue().filter(p => !(p.type === 'ledger_save' && p.record.id === id)));
        if (String(document.getElementById('edit-id').value) === String(id)) cancelEdit();
        renderAll(); showToast('削除しました');
        enqueue({ type: 'ledger_delete', id });
    }

    /* ===== 目標設定 ===== */
    const monthPrefix = () => `${reportYear}-${pad(reportMonth)}`;
    const daysInMonth = () => new Date(reportYear, reportMonth, 0).getDate();
    function monthlyTargetFor(prefix) {
        const rec = allLedgerData.find(r => (r.type === 'target_monthly' || r.type === 'target') && r.date.startsWith(prefix));
        return rec ? rec.amount : 0;
    }
    function dailyTargetsFor(prefix) {
        const t = {}; allLedgerData.forEach(r => { if (r.type === 'target_daily' && r.date.startsWith(prefix) && r.amount > 0) t[r.date] = r.amount; });
        return t;
    }
    function toggleTargetModal() {
        const m = document.getElementById('target-settings');
        if (m.style.display === 'none') {
            document.getElementById('input-target-monthly').value = monthlyTargetFor(monthPrefix()) || '';
            m.style.display = 'block';
        } else { m.style.display = 'none'; }
    }
    function saveMonthlyTarget() {
        const amt = parseInt(document.getElementById('input-target-monthly').value) || 0;
        saveTargetRecord('target_monthly', `${monthPrefix()}-01`, amt);
        document.getElementById('target-settings').style.display = 'none';
    }
    function saveDailyTarget(d) {
        const amt = parseInt(document.getElementById('input-day-target').value) || 0;
        if (d) saveTargetRecord('target_daily', d, amt);
    }
    function saveTargetRecord(type, date, amt) {
        const target = allLedgerData.find(r => r.type === type && r.date === date);
        const record = { id: target ? target.id : Date.now(), type, date, category: 'target', amount: amt, note: '', items: [], shipping: 0, discount: 0 };
        if (target) { allLedgerData[allLedgerData.findIndex(r => r.id === record.id)] = record; } else { allLedgerData.push(record); }
        renderReport(); renderCalendar(); showToast('目標を保存しました');
        enqueue({ type: 'ledger_save', record });
    }

    /* ===== カレンダー ===== */
    function renderCalendar() {
        const prefix = monthPrefix();
        document.getElementById('cal-display-month').textContent = `${reportYear}年 ${reportMonth}月`;
        const container = document.getElementById('calendar-body');
        container.innerHTML = '';

        const monthlySales = allLedgerData.filter(r => r.type === 'sales' && r.date.startsWith(prefix)).reduce((sum, r) => sum + r.amount, 0);
        const dTargets = dailyTargetsFor(prefix);
        let monthlyTarget = monthlyTargetFor(prefix);
        if (monthlyTarget === 0) monthlyTarget = Object.values(dTargets).reduce((s, v) => s + v, 0);
        // 日別の目標がない日は「月間目標 ÷ 日数」を目安にする
        const paceTarget = monthlyTargetFor(prefix) > 0 ? Math.round(monthlyTargetFor(prefix) / daysInMonth()) : 0;

        document.getElementById('cal-sum-sales').textContent = yen(monthlySales);
        document.getElementById('cal-sum-target').textContent = monthlyTarget > 0 ? yen(monthlyTarget) : '未設定';
        const hasAnyTarget = paceTarget > 0 || Object.keys(dTargets).length > 0;
        document.getElementById('cal-legend').innerHTML = hasAnyTarget
            ? `<span class="lg-hit">目標達成</span><span class="lg-miss">目標に届かず</span><span style="color:#999">（日別目標がない日は 月間目標÷日数 ${paceTarget ? yen(paceTarget) : ''} で判定）</span>`
            : `<span class="lg-has">売上あり</span><span style="color:#999">目標を設定すると、達成した日に色がつきます</span>`;

        const firstDay = new Date(reportYear, reportMonth - 1, 1).getDay();
        const lastDate = daysInMonth();
        let date = 1;
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                const cell = document.createElement('td');
                if (!(i === 0 && j < firstDay) && date <= lastDate) {
                    const fullDate = `${prefix}-${pad(date)}`;
                    if (fullDate === todayStr) cell.classList.add('cal-today');
                    if (fullDate === selectedDay) cell.classList.add('cal-selected');
                    if (j === 0) cell.classList.add('cal-sunday');
                    if (j === 6) cell.classList.add('cal-saturday');

                    const target = dTargets[fullDate] || 0;
                    const judge = target || paceTarget;
                    const actual = allLedgerData.filter(r => r.type === 'sales' && r.date === fullDate).reduce((sum, r) => sum + r.amount, 0);
                    if (actual > 0) cell.classList.add(judge ? (actual >= judge ? 'cal-hit' : 'cal-miss') : 'cal-has');

                    let html = `<span class="cal-day-num">${date}</span>`;
                    if (target > 0) html += `<span class="cal-target-amt">目: ¥${target.toLocaleString()}</span>`;
                    if (actual > 0) html += `<span class="cal-actual-amt">実: ¥${actual.toLocaleString()}</span>`;
                    if (judge > 0 && actual > 0) {
                        const pct = Math.floor((actual / judge) * 100);
                        html += `<span class="cal-pct" style="color:${pct >= 100 ? '#3c763d' : '#a15c00'}">${pct}%</span>`;
                    }
                    cell.innerHTML = html;
                    cell.onclick = () => { selectedDay = fullDate; renderCalendar(); document.getElementById('day-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
                    date++;
                }
                row.appendChild(cell);
            }
            container.appendChild(row);
            if (date > lastDate) break;
        }
        renderDayDetail();
    }

    function renderDayDetail() {
        const box = document.getElementById('day-detail');
        if (!selectedDay.startsWith(monthPrefix())) { box.innerHTML = '<p class="empty">日付をタップすると、その日の売上・仕入と目標が見られます。</p>'; return; }
        const d = new Date(selectedDay + 'T00:00:00');
        const sales = allLedgerData.filter(r => r.type === 'sales' && r.date === selectedDay);
        const purchase = allLedgerData.filter(r => r.type === 'purchase' && r.date === selectedDay);
        const sTotal = sales.reduce((s, r) => s + r.amount, 0), pTotal = purchase.reduce((s, r) => s + r.amount, 0);
        const target = dailyTargetsFor(monthPrefix())[selectedDay] || '';
        box.innerHTML = `
            <h4>${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）<small>売上 <b class="val-sales">${yen(sTotal)}</b> ／ 仕入 <b class="val-purchase">${yen(pTotal)}</b></small></h4>
            ${sales.length || purchase.length ? [...sales, ...purchase].map(recCard).join('') : '<p class="empty">この日の記録はありません</p>'}
            <div class="day-target"><span style="font-size:0.85em; font-weight:bold; color:#7c5ba6; white-space:nowrap;">🎯 この日の目標</span><div class="input-group"><input type="text" pattern="[0-9]*" id="input-day-target" inputmode="numeric" value="${target}" placeholder="未設定"></div><button onclick="saveDailyTarget('${selectedDay}')">保存</button></div>
            <div class="day-actions">
                <button style="background:#5b7da6" onclick="startInputFor('sales','${selectedDay}')">＋ この日の売上を入力</button>
                <button style="background:#d9534f" onclick="startInputFor('purchase','${selectedDay}')">＋ この日の仕入を入力</button>
            </div>`;
    }
    function startInputFor(type, date) {
        cancelEdit();
        document.getElementById(`${type}-date`).value = date;
        if (type === 'sales') renderTodayStatus();
        switchTab(type);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ===== レポート ===== */
    function sumBy(prefix, type) { return allLedgerData.filter(r => r.type === type && r.date.startsWith(prefix)).reduce((s, r) => s + r.amount, 0); }
    function compareText(cur, prev) {
        if (!prev) return '<span>先月の記録なし</span>';
        const diff = cur - prev, pct = Math.round((diff / prev) * 100);
        return `先月比 <span class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : ''}${pct}%</span>（${diff >= 0 ? '+' : '-'}${yen(Math.abs(diff))}）`;
    }
    function breakdownHtml(recs, color) {
        const m = {}; recs.forEach(r => m[r.category] = (m[r.category] || 0) + r.amount);
        const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
        if (!rows.length) return '<p class="bd-empty">記録なし</p>';
        const max = rows[0][1] || 1, total = rows.reduce((s, x) => s + x[1], 0) || 1;
        return rows.map(([k, v]) => `<div class="bd-row"><div class="bd-top"><span>${esc(k)}</span><span>${yen(v)} <small style="color:#999;font-weight:normal">${Math.round(v / total * 100)}%</small></span></div><div class="bd-bar"><i style="width:${Math.max(3, v / max * 100)}%;background:${color}"></i></div></div>`).join('');
    }
    function renderReport() {
        const prefix = monthPrefix();
        const prevDate = new Date(reportYear, reportMonth - 2, 1);
        const prevPrefix = `${prevDate.getFullYear()}-${pad(prevDate.getMonth() + 1)}`;
        document.getElementById('display-month').textContent = `${reportYear}年 ${reportMonth}月`;

        const mTarget = monthlyTargetFor(prefix);
        const dTargets = dailyTargetsFor(prefix);

        // 合計は検索に関係なく、その月のすべての記録で出す
        const monthAll = allLedgerData.filter(r => !isTargetType(r.type) && r.date.startsWith(prefix));
        const salesAll = monthAll.filter(r => r.type === 'sales'), purchaseAll = monthAll.filter(r => r.type === 'purchase');
        const sTotal = salesAll.reduce((s, r) => s + r.amount, 0);
        const pTotal = purchaseAll.reduce((s, r) => s + r.amount, 0);
        const sPrev = sumBy(prevPrefix, 'sales'), pPrev = sumBy(prevPrefix, 'purchase');

        document.getElementById('total-sales').textContent = yen(sTotal);
        document.getElementById('total-purchase').textContent = yen(pTotal);
        document.getElementById('sales-compare').innerHTML = compareText(sTotal, sPrev);
        document.getElementById('purchase-compare').innerHTML = compareText(pTotal, pPrev);
        document.getElementById('profit-compare').innerHTML = (sPrev || pPrev) ? compareText(sTotal - pTotal, sPrev - pPrev) : '';

        if (mTarget > 0) {
            const pct = Math.floor((sTotal / mTarget) * 100);
            document.getElementById('monthly-target-display').innerHTML = `<div class="progress-wrapper"><div class="progress-bar ${pct >= 100 ? 'achieved' : ''}" style="width:${Math.min(100, pct)}%;"></div></div><span class="target-text">目標:${yen(mTarget)} (${pct}%)</span>`;
        } else { document.getElementById('monthly-target-display').innerHTML = ''; }

        const profit = sTotal - pTotal;
        document.getElementById('total-profit').textContent = yen(profit);
        document.getElementById('profit-margin').textContent = sTotal > 0 ? Math.floor((profit / sTotal) * 100) + '%' : '0%';

        const salesByDate = {}; salesAll.forEach(r => salesByDate[r.date] = (salesByDate[r.date] || 0) + r.amount);
        const activeDays = Object.keys(salesByDate).length;
        document.getElementById('avg-sales').textContent = yen(activeDays > 0 ? Math.floor(sTotal / activeDays) : 0);
        document.getElementById('active-days').textContent = `稼働:${activeDays}日`;

        // 目標達成：日別目標があればその日数、なければ月間目標の達成率
        const targetDays = Object.keys(dTargets);
        if (targetDays.length) {
            const ach = targetDays.filter(d => (salesByDate[d] || 0) >= dTargets[d]).length;
            document.getElementById('achieved-days').textContent = `${ach}日`;
            document.getElementById('achieved-sub').textContent = `/ ${targetDays.length}日中`;
        } else if (mTarget > 0) {
            const pct = Math.floor((sTotal / mTarget) * 100);
            document.getElementById('achieved-days').textContent = `${pct}%`;
            document.getElementById('achieved-sub').textContent = pct >= 100 ? '月間目標 達成！' : `あと${yen(mTarget - sTotal)}`;
        } else {
            document.getElementById('achieved-days').textContent = '-';
            document.getElementById('achieved-sub').textContent = '目標 未設定';
        }

        let vm = 0, vf = 0;
        salesAll.forEach(r => (r.items || []).forEach(i => { if (/男/.test(i.name)) vm += Number(i.qty) || 0; else if (/女/.test(i.name)) vf += Number(i.qty) || 0; }));
        document.getElementById('breakdown-sales').innerHTML = breakdownHtml(salesAll, '#5b7da6') + (vm || vf ? `<p class="bd-row" style="margin-top:6px">👥 来店人数 <b>${vm + vf}名</b>（男性 ${vm}名・女性 ${vf}名）</p>` : '');
        document.getElementById('breakdown-purchase').innerHTML = breakdownHtml(purchaseAll, '#d9534f');

        // 履歴（検索・並び替えはここだけに効く）
        const kw = document.getElementById('search-keyword').value.trim().toLowerCase();
        const match = (r) => !kw || ((r.note || '') + r.category + (r.items || []).map(i => i.name).join(' ')).toLowerCase().includes(kw);
        const desc = document.getElementById('sort-order').value === 'date-desc';
        const sorter = (a, b) => desc ? (b.date.localeCompare(a.date) || b.id - a.id) : (a.date.localeCompare(b.date) || a.id - b.id);
        const sales = salesAll.filter(match).sort(sorter), purchase = purchaseAll.filter(match).sort(sorter);
        document.getElementById('count-sales').textContent = `${sales.length}件`;
        document.getElementById('count-purchase').textContent = `${purchase.length}件`;
        document.getElementById('history-sales-container').innerHTML = buildHistoryList(sales, dTargets, 'sales');
        document.getElementById('history-purchase-container').innerHTML = buildHistoryList(purchase, null, 'purchase');
    }

    // 記録1件のカード
    function recCard(r) {
        const items = (r.items || []).filter(i => i && (i.name || i.price));
        const itemsText = items.map(i => (r.type === 'sales' && (i.name === '男性' || i.name === '女性')) ? `${i.name} ${i.qty}名`
            : `${esc(i.name)} ${yen(i.price)}×${i.qty}`).join('、');
        const extra = [r.shipping ? `送料等 +${yen(r.shipping)}` : '', r.discount ? `割引 -${yen(r.discount)}` : ''].filter(Boolean).join('、');
        const pend = pendingIds().has(r.id) ? '<span class="rec-pending">送信待ち</span>' : '';
        return `<div class="rec ${r.type}">
            <div class="rec-top"><span class="rec-cat">${esc(r.category)}${pend}</span><span class="rec-amt ${r.type === 'sales' ? 'val-sales' : 'val-purchase'}">${yen(r.amount)}</span></div>
            ${itemsText || extra ? `<div class="rec-items">${itemsText}${itemsText && extra ? '、' : ''}${extra}</div>` : ''}
            ${r.note ? `<div class="rec-note">📝 ${esc(r.note)}</div>` : ''}
            <div class="rec-btns"><button class="b-edit" onclick="editRecord(${r.id})">編集</button><button class="b-del" onclick="deleteRecord(${r.id})">削除</button></div>
        </div>`;
    }
    function resetHistoryLimit() { historyLimit = { sales: HISTORY_STEP, purchase: HISTORY_STEP }; }
    function showMore(type) { historyLimit[type] += 20; renderReport(); }
    function buildHistoryList(recs, dTargets, type) {
        if (recs.length === 0) return '<p class="empty">記録なし</p>';
        let html = '', cur = null;
        const dayTotal = {}; recs.forEach(r => dayTotal[r.date] = (dayTotal[r.date] || 0) + r.amount);
        const shown = recs.slice(0, historyLimit[type]);
        shown.forEach(r => {
            if (r.date !== cur) {
                cur = r.date;
                const d = new Date(r.date + 'T00:00:00');
                let info = yen(dayTotal[r.date]);
                if (dTargets && dTargets[r.date]) { const pct = Math.floor(dayTotal[r.date] / dTargets[r.date] * 100); info += ` <span style="color:${pct >= 100 ? '#3c763d' : '#a15c00'}">(目標${pct}%)</span>`; }
                html += `<div class="day-head"><span>${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）</span><span>${info}</span></div>`;
            }
            html += recCard(r);
        });
        if (recs.length > shown.length) html += `<button class="btn-more" onclick="showMore('${type}')">もっと見る（残り${recs.length - shown.length}件）</button>`;
        return html;
    }

    /* ===== 編集 ===== */
    function editRecord(id) {
        const r = allLedgerData.find(x => x.id === id); if (!r) return;
        switchTab(r.type);
        document.getElementById('edit-banner').style.display = 'block';
        document.getElementById('edit-banner').textContent = `✏️ ${r.date.replace(/-/g, '/')} の${r.category}を編集中`;
        document.getElementById('edit-id').value = r.id;
        document.getElementById(`btn-${r.type}-submit`).textContent = "上書き保存する";
        document.getElementById(`btn-${r.type}-cancel`).style.display = 'block';
        document.getElementById(`${r.type}-date`).value = r.date;
        setCategory(r.type, r.category);
        document.getElementById(`${r.type}-note`).value = r.note || '';
        if (r.type === 'purchase') { document.getElementById('purchase-shipping').value = r.shipping || ''; document.getElementById('purchase-discount').value = r.discount || ''; }
        if (r.type === 'sales') {
            // 「男性」「女性」を含む明細は人数に（以前の形式の記録も編集できるように）
            let male = 0, female = 0;
            (r.items || []).forEach(i => { const q = Number(i.qty) || 0; if (/男/.test(i.name)) male += q; else if (/女/.test(i.name)) female += q; });
            document.getElementById('sales-male').value = male; document.getElementById('sales-female').value = female;
            document.getElementById('sales-amount').value = r.amount || '';
        } else {
            const cont = document.getElementById('purchase-items'); cont.innerHTML = '';
            if (r.items && r.items.length > 0) r.items.forEach(i => addItemRow('purchase', i.name, i.price, i.qty)); else addItemRow('purchase');
        }
        calcTotal(r.type);
        if (r.type === 'sales') renderTodayStatus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.querySelector('.pane-input').scrollTop = 0;
    }
    // 以前の区分（カフェ売上・バー売上など）の記録を編集するときは、今の区分に読み替える。読み替えられないものはそのまま残す
    const OLD_SALES_CATEGORY = { 'カフェ売上': '店舗', 'バー売上': '店舗', 'イベント参加費': 'イベント' };
    function setCategory(type, cat) {
        const sel = document.getElementById(`${type}-category`);
        sel.querySelectorAll('option[data-old]').forEach(o => o.remove());
        if (type === 'sales' && OLD_SALES_CATEGORY[cat]) cat = OLD_SALES_CATEGORY[cat];
        if (![...sel.options].some(o => o.value === cat)) { const o = new Option(cat, cat); o.dataset.old = '1'; sel.add(o); }
        sel.value = cat;
    }
    function exitEditMode() {
        document.querySelectorAll('option[data-old]').forEach(o => { const sel = o.parentElement; o.remove(); if (!sel.value) sel.selectedIndex = 0; });
        document.getElementById('edit-id').value = '';
        document.getElementById('edit-banner').style.display = 'none';
    }
    function cancelEdit() {
        const wasEditing = document.getElementById('edit-id').value;
        exitEditMode();
        if (wasEditing) { resetForm('sales'); resetForm('purchase'); }
    }

    function changeMonth(offset) { resetHistoryLimit(); reportMonth += offset; if (reportMonth < 1) { reportMonth = 12; reportYear--; } else if (reportMonth > 12) { reportMonth = 1; reportYear++; } renderReport(); renderCalendar(); }
    let toastTimer = null;
    function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2000); }
</script>
</body>
</html>
