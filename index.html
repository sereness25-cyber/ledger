<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【帳簿】セレネス売上・仕入管理</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; color: #333; }
        
        .app-container { background: #fff; max-width: 900px; margin: 0 auto; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative;}
        h1 { font-size: 1.3em; border-bottom: 2px solid #A68B5B; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; text-align: center; color: #333;}
        
        .tab-wrapper { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px 2px; border: 1px solid #ccc; background: #f9f9f9; color: #666; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 0.85em; text-align: center; transition: 0.2s; min-width: 80px;}
        .tab-btn.active-sales { background: #5b7da6; color: white; border-color: #5b7da6; }
        .tab-btn.active-purchase { background: #d9534f; color: white; border-color: #d9534f; }
        .tab-btn.active-report { background: #A68B5B; color: white; border-color: #A68B5B; }
        .tab-btn.active-calendar { background: #7c5ba6; color: white; border-color: #7c5ba6; }

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.85em; color: #555;}
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        .input-group { position: relative; }
        .input-group input { padding-right: 30px; text-align: right; font-weight: bold;}
        .input-group::after { content: "円"; position: absolute; right: 10px; top: 18px; color: #666; font-size: 0.9em;}
        
        .item-list { background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; margin-top: 5px; }
        .item-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
        .item-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .item-inputs { display: flex; gap: 5px; align-items: center; }
        .item-inputs input { margin-top: 0; padding: 10px; text-align: right;}
        .unit-text { font-size: 0.85em; color: #666; white-space: nowrap; }
        .btn-remove-item { background: #d9534f; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; min-width: 44px; }
        
        .btn-add-item { background: #e0e0e0; color: #333; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; width: 100%; margin-top: 10px; font-weight: bold;}
        .btn-add-item:hover { background: #ccc; }

        .extra-costs { display: flex; gap: 10px; margin-top: 10px; }
        .extra-costs > div { flex: 1; }
        
        .total-amount-display { font-size: 1.6em; font-weight: bold; text-align: right; padding: 15px 0 5px; color: #333; }

        .btn-submit { color: white; border: none; padding: 16px; margin-top: 20px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s;}
        .btn-sales { background-color: #5b7da6; }
        .btn-purchase { background-color: #d9534f; }
        .btn-submit:hover { opacity: 0.8; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        /* レポート画面のスタイル */
        .summary-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .summary-month { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #A68B5B; display: flex; justify-content: space-between; align-items: center;}
        .summary-month button { background: none; border: 1px solid #ccc; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9em;}
        
        .target-btn { background: none; border: 1px dashed #A68B5B; color: #A68B5B; width: 100%; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; font-weight: bold; margin-bottom: 15px; transition: 0.2s;}
        .target-btn:hover { background: #fcfaf7; }
        
        .progress-wrapper { background: #e0e0e0; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background: #5b7da6; border-radius: 3px; transition: width 0.5s; }
        .progress-bar.achieved { background: #A68B5B; }
        .target-text { font-size: 0.75em; color: #666; margin-top: 5px; display: block; }
        
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .summary-item { padding: 15px; border-radius: 6px; }
        .item-sales { background: #eef4fb; border-left: 4px solid #5b7da6; }
        .item-purchase { background: #fdf2f2; border-left: 4px solid #d9534f; }
        .summary-label { font-size: 0.8em; color: #666; display: block; margin-bottom: 5px;}
        .summary-value { font-size: 1.4em; font-weight: bold; }
        .val-sales { color: #5b7da6; }
        .val-purchase { color: #d9534f; }

        .profit-box { background: #f5f5f0; padding: 20px 15px; border-radius: 6px; border-left: 4px solid #A68B5B; box-shadow: inset 0 0 10px rgba(0,0,0,0.02);}
        .profit-value { font-size: 1.8em; font-weight: bold; color: #333; display: block; margin-top: 5px; }

        .profit-details { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
        .profit-details div { text-align: center; flex: 1; padding: 0 5px; }
        .profit-details div:not(:last-child) { border-right: 1px dashed #ccc; }
        .detail-label { display: block; font-size: 0.75em; color: #666; margin-bottom: 3px; }
        .detail-value { font-size: 1.1em; font-weight: bold; color: #333; }
        .detail-sub { display: block; font-size: 0.7em; color: #888; margin-top: 2px; }

        /* ▼ カレンダー表示のスタイル ▼ */
        .cal-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; background: #fff;}
        .cal-table th { background: #f8f8f8; padding: 10px 0; border: 1px solid #ddd; font-size: 0.8em; color: #666; font-weight: normal;}
        .cal-table td { height: 80px; border: 1px solid #ddd; vertical-align: top; padding: 4px; position: relative; cursor: pointer; overflow: hidden;}
        .cal-table td:hover { background: #fcfaf7; }
        .cal-day-num { font-size: 0.85em; font-weight: bold; color: #888; margin-bottom: 2px; display: block;}
        /* 金額がはみ出さないように調整 */
        .cal-target-amt, .cal-actual-amt, .cal-pct { font-size: 0.65em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.5px; line-height: 1.3;}
        .cal-target-amt { color: #5b7da6; font-weight: bold; }
        .cal-actual-amt { color: #333; margin-top: 2px;}
        .cal-pct { color: #A68B5B; font-weight: bold;}
        .cal-today { background-color: #fff9e6 !important; }
        .cal-sunday { color: #d9534f; }
        .cal-saturday { color: #5b7da6; }

        .history-controls { display: flex; gap: 10px; margin-bottom: 15px; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .history-controls input { flex: 2; margin-top: 0; padding: 10px; }
        .history-controls select { flex: 1; margin-top: 0; padding: 10px; }

        .history-split { display: flex; gap: 20px; align-items: flex-start; }
        .history-col { flex: 1; min-width: 0; background: #fff; }
        .history-col h4 { margin: 0 0 10px; font-size: 1.1em; border-bottom: 2px solid; padding-bottom: 8px; }
        .col-sales h4 { color: #5b7da6; border-color: #5b7da6; }
        .col-purchase h4 { color: #d9534f; border-color: #d9534f; }

        .date-group { margin-bottom: 15px; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; background: #fff;}
        .date-header { background: #f4f7f6; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; transition: 0.2s; }
        .date-header:hover { background: #eaf0f4; }
        .date-title { font-weight: bold; font-size: 0.95em; color: #333; }
        .date-summary { font-size: 0.85em; text-align: right; line-height: 1.4; }
        .date-content { display: none; padding: 0 15px;}
        .date-content.open { display: block; }

        .history-item { padding: 15px 0; border-bottom: 1px dashed #ccc; display: flex; flex-direction: column;}
        .history-right { text-align: right; font-weight: bold; font-size: 1.1em; display: flex; flex-direction: column; align-items: flex-end;}
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.7em; color: white; margin-right: 5px;}
        .bg-sales { background-color: #5b7da6; }
        .bg-purchase { background-color: #d9534f; }

        .history-details { background: #f9f9f9; border: 1px solid #eaeaea; border-radius: 4px; padding: 10px; margin-top: 10px; font-size: 0.85em; color: #555; }
        .history-detail-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #e0e0e0; padding: 4px 0; }
        .history-detail-row:last-child { border-bottom: none; }
        .history-detail-name { flex: 1; }
        .history-detail-calc { font-family: monospace; color: #888; }
        .extra-cost-row { color: #d9534f; font-size: 0.9em; margin-top: 5px; border-top: 1px dashed #ddd; padding-top: 5px;}
        .extra-discount-row { color: #5b7da6; font-size: 0.9em;}

        .btn-group { display: flex; gap: 5px; margin-top: 8px; }
        .action-btn { color: white; border: none; padding: 6px 10px; border-radius: 3px; font-size: 0.8em; cursor: pointer; }
        .btn-edit { background: #5cb85c; }
        .btn-del { background: #ccc; }
        .btn-toggle { background: #f0ad4e; margin-top: 5px; width: fit-content; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 30px; font-size: 0.95em; display: none; z-index: 1000; white-space: nowrap;}
        #edit-banner { background: #f0ad4e; color: white; text-align: center; padding: 12px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; display: none;}
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 2000; display: flex; justify-content: center; align-items: center; border-radius: 8px; font-weight: bold; color: #A68B5B; font-size: 1.2em; flex-direction: column;}

        @media (max-width: 700px) {
            body { padding: 0; background-color: #fff; } 
            .app-container { max-width: 100%; box-shadow: none; border-radius: 0; padding: 15px 10px; }
            h1 { font-size: 1.1em; margin-bottom: 10px; }
            .tab-btn { font-size: 0.8em; padding: 10px 2px; }
            .history-split { flex-direction: column; gap: 20px; }
            .cal-table td { height: 75px; }
            .cal-day-num { font-size: 0.75em; }
            .cal-target-amt, .cal-actual-amt, .cal-pct { font-size: 0.55em; letter-spacing: -0.5px;}
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loading-overlay">データを同期中...<br><span style="font-size: 0.7em; color:#666; margin-top:10px;">(少々お待ちください)</span></div>

    <h1>セレネス 帳簿・収益管理</h1>
    
    <div class="tab-wrapper">
        <button class="tab-btn active-sales" id="tab-sales" onclick="switchTab('sales')">売上入力</button>
        <button class="tab-btn" id="tab-purchase" onclick="switchTab('purchase')">仕入入力</button>
        <button class="tab-btn" id="tab-report" onclick="switchTab('report')">レポート</button>
        <button class="tab-btn" id="tab-calendar" onclick="switchTab('calendar')">目標カレンダー</button>
    </div>

    <div id="edit-banner">現在、過去の記録を編集中です...</div>
    <input type="hidden" id="edit-id">

    <div id="section-sales">
        <label>日付</label>
        <input type="date" id="sales-date">
        <label>売上区分</label>
        <select id="sales-category">
            <option value="カフェ売上">カフェ売上 (昼)</option>
            <option value="バー売上">バー売上 (夜)</option>
            <option value="イベント参加費">イベント参加費</option>
            <option value="その他">その他</option>
        </select>
        <label>内訳（何を何個）</label>
        <div class="item-list" id="sales-items"></div>
        <button type="button" class="btn-add-item" onclick="addItemRow('sales')">＋ さらに明細を追加する</button>
        <div class="total-amount-display">合計: <span id="sales-total" class="val-sales">¥0</span></div>
        <label>メモ（任意）</label>
        <input type="text" id="sales-note" placeholder="例：〇〇様ご来店 など">
        <button class="btn-submit btn-sales" id="btn-sales-submit" onclick="saveData('sales')">売上を記録する</button>
    </div>

    <div id="section-purchase" style="display: none;">
        <label>日付</label>
        <input type="date" id="purchase-date">
        <label>経費区分</label>
        <select id="purchase-category">
            <option value="酒類・飲料">酒類・飲料</option>
            <option value="食材・おつまみ">食材・おつまみ</option>
            <option value="消耗品（紙袋・洗剤など）">消耗品（紙袋・洗剤など）</option>
            <option value="備品・設備">備品・設備</option>
            <option value="広告宣伝費">広告宣伝費</option>
            <option value="家賃・光熱費など">家賃・光熱費など固定費</option>
            <option value="その他経費">その他経費</option>
        </select>
        <label>内訳（何を何個）</label>
        <div class="item-list" id="purchase-items"></div>
        <button type="button" class="btn-add-item" onclick="addItemRow('purchase')">＋ さらに明細を追加する</button>
        <div class="extra-costs">
            <div><label style="margin-top: 0;">送料・手数料 (+)</label><div class="input-group"><input type="number" id="purchase-shipping" placeholder="0" inputmode="numeric" oninput="calcTotal('purchase')"></div></div>
            <div><label style="margin-top: 0;">割引・ポイント (-)</label><div class="input-group"><input type="number" id="purchase-discount" placeholder="0" inputmode="numeric" oninput="calcTotal('purchase')"></div></div>
        </div>
        <div class="total-amount-display">合計: <span id="purchase-total" class="val-purchase">¥0</span></div>
        <label>購入先・メモ</label>
        <input type="text" id="purchase-note" placeholder="例：Amazon など">
        <button class="btn-submit btn-purchase" id="btn-purchase-submit" onclick="saveData('purchase')">仕入・経費を記録する</button>
    </div>

    <div id="section-report" style="display: none;">
        <div class="summary-box">
            <div class="summary-month"><button onclick="changeMonth(-1)">＜ 先月</button><span id="display-month">2026年 3月</span><button onclick="changeMonth(1)">来月 ＞</button></div>
            <button class="target-btn" onclick="toggleTargetModal()">🎯 売上目標を個別に設定する</button>
            <div id="target-settings" style="display: none; background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; text-align: left; position: relative;">
                <button onclick="toggleTargetModal()" style="position: absolute; right: 10px; top: 10px; background: none; border: none; font-size: 1.5em; color: #999; cursor: pointer;">×</button>
                <h4 style="margin: 0 0 10px; font-size: 1em; color: #A68B5B;">🎯 月間トータル目標</h4>
                <div class="input-group"><input type="number" id="input-target-monthly" inputmode="numeric"></div>
                <button class="btn-submit" style="margin-top:10px; padding:10px; background:#A68B5B; font-size: 0.9em;" onclick="saveMonthlyTarget()">保存</button>
                <hr style="border:0; border-top:1px dashed #ccc; margin: 15px 0;">
                <h4 style="margin: 0 0 10px; font-size: 1em; color: #5b7da6;">📅 1日ごとの目標</h4>
                <input type="date" id="input-target-date" onchange="loadDailyTarget()">
                <div class="input-group" style="margin-top:5px;"><input type="number" id="input-target-daily" inputmode="numeric"></div>
                <button class="btn-submit" style="margin-top:10px; padding:10px; background:#5b7da6; font-size: 0.9em;" onclick="saveDailyTarget()">保存</button>
            </div>
            <div class="summary-grid">
                <div class="summary-item item-sales"><span class="summary-label">売上合計</span><span class="summary-value val-sales" id="total-sales">¥0</span><div id="monthly-target-display"></div></div>
                <div class="summary-item item-purchase"><span class="summary-label">仕入合計</span><span class="summary-value val-purchase" id="total-purchase">¥0</span></div>
            </div>
            <div class="profit-box">
                <span class="summary-label">今月の粗利益</span><span class="profit-value" id="total-profit">¥0</span>
                <div class="profit-details">
                    <div><span class="detail-label">利益率</span><span class="detail-value" id="profit-margin">0%</span></div>
                    <div><span class="detail-label">1日平均</span><span class="detail-value" id="avg-sales">¥0</span><span class="detail-sub" id="active-days"></span></div>
                    <div><span class="detail-label">目標達成</span><span class="detail-value" id="achieved-days">-</span><span class="detail-sub" id="achieved-sub"></span></div>
                </div>
            </div>
        </div>
        <div class="history-controls"><input type="text" id="search-keyword" placeholder="検索..." oninput="renderReport()"><select id="sort-order" onchange="renderReport()"><option value="date-desc">新しい順</option><option value="date-asc">古い順</option></select></div>
        <div class="history-split">
            <div class="history-col col-sales"><h4>売上履歴</h4><div class="history-list" id="history-sales-container"></div></div>
            <div class="history-col col-purchase"><h4>仕入履歴</h4><div class="history-list" id="history-purchase-container"></div></div>
        </div>
    </div>

    <div id="section-calendar" style="display: none;">
        <div class="summary-box" style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; padding: 15px;">
            <div class="summary-month" style="margin-bottom: 0; justify-content: center; gap: 15px;">
                <button onclick="changeMonth(-1)">＜</button>
                <span id="cal-display-month">2026年 3月</span>
                <button onclick="changeMonth(1)">＞</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #eee; padding-top: 10px; font-size: 0.9em;">
                <div><span style="color:#666;">今月の目標:</span> <span id="cal-sum-target" style="font-weight:bold; color:#A68B5B;">¥0</span></div>
                <div><span style="color:#666;">今月の売上:</span> <span id="cal-sum-sales" style="font-weight:bold; font-size: 1.2em; color:#333;">¥0</span></div>
            </div>
        </div>
        <table class="cal-table">
            <thead>
                <tr><th class="cal-sunday">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="cal-saturday">土</th></tr>
            </thead>
            <tbody id="calendar-body"></tbody>
        </table>
        <p style="font-size: 0.7em; color: #888; margin-top: 10px;">※日付をタップするとその日の目標を設定できます。</p>
    </div>
</div>

<div id="toast"></div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbysuqUZwOrTU_-GHNpAb-3rEr4tU9fHfn0aIPuBnzT-uvHnql8yyVFqT4pCQvu8gfNu/exec";
    let allLedgerData = []; 
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    
    window.onload = () => {
        loadLedgerData();
        document.getElementById('sales-date').value = todayStr;
        document.getElementById('purchase-date').value = todayStr;
        addItemRow('sales'); addItemRow('purchase');
    };

    let reportYear = today.getFullYear();
    let reportMonth = today.getMonth() + 1;

    function loadLedgerData() {
        document.getElementById('loading-overlay').style.display = 'flex';
        fetch(GAS_URL).then(res => res.json()).then(data => {
            allLedgerData = (data.ledger || []).map(r => {
                if (r.date && r.date.includes('T')) {
                    const d = new Date(r.date);
                    r.date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                }
                return r;
            });
            renderReport();
            renderCalendar();
            document.getElementById('loading-overlay').style.display = 'none';
        }).catch(err => {
            document.getElementById('loading-overlay').style.display = 'none';
        });
    }

    function switchTab(tab) {
        ['sales','purchase','report','calendar'].forEach(t => document.getElementById(`section-${t}`).style.display = (t === tab ? 'block' : 'none'));
        ['sales','purchase','report','calendar'].forEach(t => document.getElementById(`tab-${t}`).className = 'tab-btn' + (t === tab ? ` active-${t}` : ''));
        if(tab === 'report') renderReport();
        if(tab === 'calendar') renderCalendar();
    }

    // フォーム操作
    function addItemRow(type, name='', price='', qty=1) {
        const container = document.getElementById(`${type}-items`);
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `<input type="text" class="i-name" placeholder="品名" value="${name}"><div class="item-inputs"><input type="number" class="i-price" placeholder="単価" value="${price}" oninput="calcTotal('${type}')" style="flex:3;"><span class="unit-text">円×</span><input type="number" class="i-qty" value="${qty}" oninput="calcTotal('${type}')" style="flex:2;"><span class="unit-text">個</span><button type="button" class="btn-remove-item" onclick="removeRow(this,'${type}')">✖</button></div>`;
        container.appendChild(row);
    }
    function removeRow(btn, type) { btn.parentElement.parentElement.remove(); calcTotal(type); }
    function calcTotal(type) {
        const rows = document.querySelectorAll(`#${type}-items .item-row`);
        let total = 0;
        rows.forEach(r => total += (parseInt(r.querySelector('.i-price').value) || 0) * (parseInt(r.querySelector('.i-qty').value) || 0));
        if(type === 'purchase') total += (parseInt(document.getElementById('purchase-shipping').value) || 0) - (parseInt(document.getElementById('purchase-discount').value) || 0);
        document.getElementById(`${type}-total`).textContent = '¥' + Math.max(0, total).toLocaleString();
        return total;
    }

    // 保存・削除
    function saveData(type) {
        const date = document.getElementById(`${type}-date`).value;
        const cat = document.getElementById(`${type}-category`).value;
        const note = document.getElementById(`${type}-note`).value;
        const editId = document.getElementById('edit-id').value;
        const items = [];
        document.querySelectorAll(`#${type}-items .item-row`).forEach(r => {
            const n = r.querySelector('.i-name').value;
            const p = parseInt(r.querySelector('.i-price').value) || 0;
            const q = parseInt(r.querySelector('.i-qty').value) || 0;
            if(n||p||q) items.push({name:n||'名称なし', price:p, qty:q});
        });
        const total = calcTotal(type);
        if(!date || (total <= 0 && items.length === 0)) return alert("正しく入力してください");

        const record = { id: editId ? parseInt(editId) : Date.now(), type, date, category: cat, amount: total, note, items, shipping: type==='purchase'?parseInt(document.getElementById('purchase-shipping').value)||0:0, discount: type==='purchase'?parseInt(document.getElementById('purchase-discount').value)||0:0 };
        if(editId) { const idx = allLedgerData.findIndex(r=>r.id === record.id); if(idx!==-1) allLedgerData[idx] = record; } else { allLedgerData.push(record); }
        renderReport(); renderCalendar(); showToast('保存しました');
        document.getElementById('edit-id').value = ''; document.getElementById('edit-banner').style.display='none';
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'ledger_save', record }) });
    }

    function deleteRecord(id) {
        if(!confirm("削除しますか？")) return;
        allLedgerData = allLedgerData.filter(r => r.id !== id);
        renderReport(); renderCalendar(); showToast('削除しました');
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'ledger_delete', id }) });
    }

    // 目標設定
    function toggleTargetModal() {
        const m = document.getElementById('target-settings');
        if(m.style.display==='none'){
            const prefix = `${reportYear}-${String(reportMonth).padStart(2,'0')}`;
            const target = allLedgerData.find(r => (r.type==='target_monthly'||r.type==='target') && r.date.startsWith(prefix));
            document.getElementById('input-target-monthly').value = target ? target.amount : '';
            document.getElementById('input-target-date').value = todayStr;
            loadDailyTarget(); m.style.display='block';
        } else { m.style.display='none'; }
    }
    function loadDailyTarget() {
        const d = document.getElementById('input-target-date').value;
        const target = allLedgerData.find(r => r.type==='target_daily' && r.date === d);
        document.getElementById('input-target-daily').value = target ? target.amount : '';
    }
    function saveMonthlyTarget() {
        const amt = parseInt(document.getElementById('input-target-monthly').value) || 0;
        saveTargetRecord('target_monthly', `${reportYear}-${String(reportMonth).padStart(2,'0')}-01`, amt);
    }
    function saveDailyTarget() {
        const d = document.getElementById('input-target-date').value;
        const amt = parseInt(document.getElementById('input-target-daily').value) || 0;
        if(d) saveTargetRecord('target_daily', d, amt);
    }
    function saveTargetRecord(type, date, amt) {
        const target = allLedgerData.find(r => r.type===type && r.date === date);
        const record = { id: target?target.id:Date.now(), type, date, category:'target', amount:amt, note:'', items:[], shipping:0, discount:0 };
        if(target) { allLedgerData[allLedgerData.findIndex(r=>r.id===record.id)] = record; } else { allLedgerData.push(record); }
        renderReport(); renderCalendar(); showToast('目標を保存しました');
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'ledger_save', record }) });
    }

    // カレンダー描画
    function renderCalendar() {
        const monthLabel = `${reportYear}年 ${reportMonth}月`;
        document.getElementById('cal-display-month').textContent = monthLabel;
        const container = document.getElementById('calendar-body');
        container.innerHTML = '';

        // ▼ ▼ ▼ 追加：月間売上と目標の自動計算 ▼ ▼ ▼
        const monthPrefix = `${reportYear}-${String(reportMonth).padStart(2, '0')}`;
        
        // 1. 今月の売上合計
        const monthlySales = allLedgerData
            .filter(r => r.type === 'sales' && r.date.startsWith(monthPrefix))
            .reduce((sum, r) => sum + r.amount, 0);
        
        // 2. 今月の目標額（月間目標がなければ、日別目標を自動で足し算）
        const mTargetRec = allLedgerData.find(r => (r.type === 'target_monthly' || r.type === 'target') && r.date.startsWith(monthPrefix));
        let monthlyTarget = mTargetRec ? mTargetRec.amount : 0;
        
        if (monthlyTarget === 0) {
             monthlyTarget = allLedgerData
                 .filter(r => r.type === 'target_daily' && r.date.startsWith(monthPrefix))
                 .reduce((sum, r) => sum + r.amount, 0);
        }
        
        // 3. 画面の上部に反映
        document.getElementById('cal-sum-sales').textContent = '¥' + monthlySales.toLocaleString();
        document.getElementById('cal-sum-target').textContent = monthlyTarget > 0 ? '¥' + monthlyTarget.toLocaleString() : '未設定';
        // ▲ ▲ ▲ ここまで ▲ ▲ ▲

        const firstDay = new Date(reportYear, reportMonth - 1, 1).getDay();
        const lastDate = new Date(reportYear, reportMonth, 0).getDate();
        
        let date = 1;
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                const cell = document.createElement('td');
                if (i === 0 && j < firstDay) {
                    // 空白
                } else if (date > lastDate) {
                    // 空白
                } else {
                    const fullDate = `${reportYear}-${String(reportMonth).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                    if(fullDate === todayStr) cell.classList.add('cal-today');
                    if(j === 0) cell.classList.add('cal-sunday');
                    if(j === 6) cell.classList.add('cal-saturday');

                    const dailyTarget = allLedgerData.find(r => r.type === 'target_daily' && r.date === fullDate);
                    const dailyActual = allLedgerData.filter(r => r.type === 'sales' && r.date === fullDate).reduce((sum, r) => sum + r.amount, 0);
                    
                    let html = `<span class="cal-day-num">${date}</span>`;
                    if(dailyTarget && dailyTarget.amount > 0) html += `<span class="cal-target-amt">目: ¥${dailyTarget.amount.toLocaleString()}</span>`;
                    if(dailyActual > 0) html += `<span class="cal-actual-amt">実: ¥${dailyActual.toLocaleString()}</span>`;
                    if(dailyTarget && dailyTarget.amount > 0 && dailyActual > 0) {
                        const pct = Math.floor((dailyActual / dailyTarget.amount) * 100);
                        html += `<span class="cal-pct" style="color:${pct>=100?'#A68B5B':'#888'}">${pct}%</span>`;
                    }

                    cell.innerHTML = html;
                    cell.onclick = () => {
                        document.getElementById('input-target-date').value = fullDate;
                        switchTab('report');
                        toggleTargetModal();
                    };
                    date++;
                }
                row.appendChild(cell);
            }
            container.appendChild(row);
            if (date > lastDate) break;
        }
    }

    // レポート描画
    function renderReport() {
        const prefix = `${reportYear}-${String(reportMonth).padStart(2, '0')}`;
        document.getElementById('display-month').textContent = `${reportYear}年 ${reportMonth}月`;

        const mTargetRec = allLedgerData.find(r => (r.type==='target_monthly'||r.type==='target') && r.date.startsWith(prefix));
        const mTarget = mTargetRec ? mTargetRec.amount : 0;
        const dTargets = {}; allLedgerData.forEach(r => { if(r.type==='target_daily') dTargets[r.date] = r.amount; });

        let monthlyRecords = allLedgerData.filter(r => !r.type.startsWith('target') && r.date.startsWith(prefix));
        const kw = document.getElementById('search-keyword').value.toLowerCase();
        if(kw) monthlyRecords = monthlyRecords.filter(r => (r.note + r.category + (r.items?r.items.map(i=>i.name).join(''):'')).toLowerCase().includes(kw));
        
        const sort = document.getElementById('sort-order').value;
        monthlyRecords.sort((a,b) => sort==='date-desc' ? new Date(b.date)-new Date(a.date) : new Date(a.date)-new Date(b.date));

        const sales = monthlyRecords.filter(r=>r.type==='sales');
        const purchase = monthlyRecords.filter(r=>r.type==='purchase');
        const sTotal = sales.reduce((sum,r)=>sum+r.amount, 0);
        const pTotal = purchase.reduce((sum,r)=>sum+r.amount, 0);

        document.getElementById('total-sales').textContent = '¥'+sTotal.toLocaleString();
        document.getElementById('total-purchase').textContent = '¥'+pTotal.toLocaleString();
        
        // 月間進捗
        if(mTarget>0){
            const pct = Math.floor((sTotal/mTarget)*100);
            document.getElementById('monthly-target-display').innerHTML = `<div class="progress-wrapper"><div class="progress-bar ${pct>=100?'achieved':''}" style="width:${Math.min(100,pct)}%;"></div></div><span class="target-text">目標:¥${mTarget.toLocaleString()} (${pct}%)</span>`;
        } else { document.getElementById('monthly-target-display').innerHTML = ''; }

        const profit = sTotal - pTotal;
        document.getElementById('total-profit').textContent = '¥'+profit.toLocaleString();
        document.getElementById('profit-margin').textContent = sTotal>0 ? Math.floor((profit/sTotal)*100)+'%' : '0%';
        
        const salesByDate = {}; sales.forEach(r => salesByDate[r.date] = (salesByDate[r.date]||0)+r.amount);
        const activeDays = Object.keys(salesByDate).length;
        document.getElementById('avg-sales').textContent = '¥'+(activeDays>0?Math.floor(sTotal/activeDays):0).toLocaleString();
        document.getElementById('active-days').textContent = `稼働:${activeDays}日`;

        let achDays = 0, countWithTarget = 0;
        Object.keys(dTargets).forEach(d => { if(d.startsWith(prefix)){ countWithTarget++; if((salesByDate[d]||0)>=dTargets[d]) achDays++; } });
        document.getElementById('achieved-days').textContent = countWithTarget>0 ? `${achDays}日` : '-';
        document.getElementById('achieved-sub').textContent = countWithTarget>0 ? `/ ${countWithTarget}日中` : '設定なし';

        document.getElementById('history-sales-container').innerHTML = buildHistoryList(sales, true, 'sales', dTargets);
        document.getElementById('history-purchase-container').innerHTML = buildHistoryList(purchase, true, 'purchase');
    }

    // 履歴リストの生成
    function buildHistoryList(recs, group, type, dTargets={}) {
        if(recs.length===0) return '<p style="text-align:center;color:#999;font-size:0.8em;padding:10px;">なし</p>';
        const grouped = {};
        recs.forEach(r => { 
            if(!grouped[r.date]) grouped[r.date]={amt:0, list:[]}; 
            grouped[r.date].list.push(r); 
            grouped[r.date].amt+=r.amount; 
        });
        
        let html = '';
        Object.keys(grouped).sort((a,b)=>document.getElementById('sort-order').value==='date-desc'?new Date(b)-new Date(a):new Date(a)-new Date(b)).forEach(d => {
            const g = grouped[d];
            let targetInfo = '';
            if(type==='sales' && dTargets[d]) {
                const pct = Math.floor((g.amt/dTargets[d])*100);
                targetInfo = `<br><span style="font-size:0.7em; color:${pct>=100?'#A68B5B':'#888'};">目標:¥${dTargets[d].toLocaleString()} (${pct}%)</span>`;
            }
            
            const isOpen = (d === todayStr) ? 'open' : '';

            html += `
            <div class="date-group">
                <div class="date-header" onclick="this.nextElementSibling.classList.toggle('open')">
                    <span class="date-title">${d.replace(/-/g,'/')}</span>
                    <span class="date-summary" style="color:${type==='sales'?'#5b7da6':'#d9534f'}; font-weight:bold;">
                        ${type==='sales'?'売':'仕'}:¥${g.amt.toLocaleString()}${targetInfo}
                    </span>
                </div>
                <div class="date-content ${isOpen}">`;
            
            g.list.forEach(r => {
                let itemsHtml = '';
                if(r.items && r.items.length > 0) {
                    itemsHtml = `<div class="history-details" id="details-${r.id}" style="display:none;">`;
                    r.items.forEach(i => {
                        itemsHtml += `<div class="history-detail-row"><span>${i.name}</span><span class="history-detail-calc">¥${i.price.toLocaleString()}×${i.qty}</span></div>`;
                    });
                    if(r.shipping) itemsHtml += `<div class="history-detail-row extra-cost-row"><span>送料・手数料</span><span>+¥${r.shipping.toLocaleString()}</span></div>`;
                    if(r.discount) itemsHtml += `<div class="history-detail-row extra-discount-row"><span>割引・ポイント</span><span>-¥${r.discount.toLocaleString()}</span></div>`;
                    itemsHtml += `</div>`;
                }

                html += `
                <div class="history-item">
                    <div class="history-top-row">
                        <div class="history-left">
                            <div class="history-cat"><span class="badge ${type==='sales'?'bg-sales':'bg-purchase'}">${type==='sales'?'売上':'仕入'}</span>${r.category}</div>
                            <div class="history-note">${r.note||''}</div>
                        </div>
                        <div class="history-right">
                            ¥${r.amount.toLocaleString()}
                            <div class="btn-group">
                                <button class="action-btn btn-edit" onclick="editRecord(${r.id})">編</button>
                                <button class="action-btn btn-del" onclick="deleteRecord(${r.id})">消</button>
                            </div>
                        </div>
                    </div>`;
                
                if(itemsHtml) {
                    html += `<button class="action-btn btn-toggle" onclick="const e=document.getElementById('details-${r.id}'); e.style.display=e.style.display==='block'?'none':'block';">▼ 内訳をみる</button>${itemsHtml}`;
                }
                html += `</div>`;
            });
            html += `</div></div>`;
        });
        return html;
    }

    function editRecord(id) {
        const r = allLedgerData.find(x=>x.id===id); if(!r) return;
        switchTab(r.type);
        document.getElementById('edit-banner').style.display='block'; document.getElementById('edit-id').value=r.id;
        document.getElementById(`btn-${r.type}-submit`).textContent="上書き保存する";
        document.getElementById(`${r.type}-date`).value=r.date; document.getElementById(`${r.type}-category`).value=r.category;
        document.getElementById(`${r.type}-note`).value=r.note;
        if(r.type==='purchase'){ document.getElementById('purchase-shipping').value=r.shipping||''; document.getElementById('purchase-discount').value=r.discount||''; }
        const cont = document.getElementById(`${r.type}-items`); cont.innerHTML='';
        if(r.items && r.items.length>0) r.items.forEach(i=>addItemRow(r.type,i.name,i.price,i.qty)); else addItemRow(r.type);
        calcTotal(r.type); window.scrollTo({top:0, behavior:'smooth'});
    }

    function changeMonth(offset) { reportMonth += offset; if(reportMonth<1){reportMonth=12; reportYear--;} else if(reportMonth>12){reportMonth=1; reportYear++;} renderReport(); renderCalendar(); }
    function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
</script>
</body>
